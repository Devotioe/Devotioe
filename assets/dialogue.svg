<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0 0 720 150">
  <style>
    .t { font: 22px 'Courier New','DejaVu Sans Mono',Menlo,monospace; fill: #FFFFFF; white-space: pre; }
    .cv { fill: #000000; }
    .c1 { animation: l1 9s infinite steps(20, end); }
    .c2 { animation: l2 9s infinite steps(36, end); }
    @keyframes l1 { 0% { transform: translateX(0); } 18% { transform: translateX(264px); } 100% { transform: translateX(264px); } }
    @keyframes l2 { 0%, 22% { transform: translateX(0); } 55% { transform: translateX(476px); } 100% { transform: translateX(476px); } }
  </style>
  <rect x="0" y="0" width="720" height="150" fill="#000"/>
  <rect x="6" y="6" width="708" height="138" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <text class="t" x="40" y="62" textLength="264" lengthAdjust="spacingAndGlyphs">* The code compiles.</text>
  <text class="t" x="40" y="102" textLength="476" lengthAdjust="spacingAndGlyphs">* You are filled with DETERMINATION.</text>
  <defs><clipPath id="in"><rect x="12" y="12" width="696" height="126"/></clipPath></defs>
  <g clip-path="url(#in)">
  <rect class="cv c1" x="38" y="38" width="600" height="34"/>
  <rect class="cv c2" x="38" y="78" width="600" height="34"/>
  </g>
</svg>
