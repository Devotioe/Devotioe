<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0 0 720 150">
  <!-- Font: "Sans" by Ryan B (rilencavy), https://fontstruct.com/fontstructions/show/1212388/sans_85, CC BY-SA 3.0 (TTF via gitlab.com/cartr/undertale-fonts). Sans portrait sprites from UNDERTALE by Toby Fox. -->
  <style>
    @font-face { font-family: 'UTSans'; src: url(data:font/ttf;base64,) format('truetype'); }
    .t { font: 26px 'UTSans','Comic Sans MS',sans-serif; fill: #FFFFFF; white-space: pre; }
    .cv { fill: #000000; }
    @keyframes closed { 0% { opacity: 1; } 20.000% { opacity: 0; } 56.250% { opacity: 1; } 61.250% { opacity: 0; } 100% { opacity: 0; } }
    .closed { animation: closed 16.0s infinite step-end; }
    @keyframes black { 0% { opacity: 0; } 20.000% { opacity: 1; } 47.500% { opacity: 0; } 61.250% { opacity: 1; } 100% { opacity: 1; } }
    .black { animation: black 16.0s infinite step-end; }
    @keyframes blueA { 0% { opacity: 0; } 47.500% { opacity: 1; } 56.250% { opacity: 0; } 100% { opacity: 0; } }
    .blueA { animation: blueA 16.0s infinite step-end; }
    @keyframes blueB { 0% { opacity: 0; } 48.250% { opacity: 1; } 49.000% { opacity: 0; } 49.750% { opacity: 1; } 50.500% { opacity: 0; } 51.250% { opacity: 1; } 52.000% { opacity: 0; } 52.750% { opacity: 1; } 53.500% { opacity: 0; } 54.250% { opacity: 1; } 55.000% { opacity: 0; } 55.750% { opacity: 1; } 56.250% { opacity: 0; } 100% { opacity: 0; } }
    .blueB { animation: blueB 16.0s infinite step-end; }
    @keyframes flash { 0% { opacity: 0; } 47.500% { opacity: 1; } 48.250% { opacity: 0; } 49.000% { opacity: 1; } 49.500% { opacity: 0; } 100% { opacity: 0; } }
    .flash { animation: flash 16.0s infinite step-end; }
    @keyframes page2 { 0% { opacity: 0; } 61.250% { opacity: 1; } 100% { opacity: 1; } }
    .page2 { animation: page2 16.0s infinite step-end; }
    @keyframes page1 { 0% { opacity: 1; } 61.250% { opacity: 0; } 100% { opacity: 0; } }
    .page1 { animation: page1 16.0s infinite step-end; }
    @keyframes ty1 { 0% { transform: translateX(0); } 1.875% { transform: translateX(0); animation-timing-function: steps(30, end); } 16.875% { transform: translateX(317px); } 100% { transform: translateX(317px); } }
    .ty1 { animation: ty1 16.0s infinite linear; }
    @keyframes ty2 { 0% { transform: translateX(0); } 21.250% { transform: translateX(0); animation-timing-function: steps(45, end); } 43.750% { transform: translateX(505px); } 100% { transform: translateX(505px); } }
    .ty2 { animation: ty2 16.0s infinite linear; }
    @keyframes ty3 { 0% { transform: translateX(0); } 62.500% { transform: translateX(0); animation-timing-function: steps(31, end); } 78.000% { transform: translateX(354px); } 100% { transform: translateX(354px); } }
    .ty3 { animation: ty3 16.0s infinite linear; }
  </style>
  <defs><clipPath id="in"><rect x="12" y="12" width="696" height="126"/></clipPath></defs>
  <rect width="720" height="150" fill="#000"/>
  <rect x="6" y="6" width="708" height="138" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <image class="closed" x="30" y="15" width="120" height="120" style="image-rendering:pixelated" href="data:image/png;base64,"/>
  <image class="black" x="30" y="15" width="120" height="120" style="image-rendering:pixelated" href="data:image/png;base64,"/>
  <image class="blueA" x="30" y="15" width="120" height="120" style="image-rendering:pixelated" href="data:image/png;base64,"/>
  <image class="blueB" x="30" y="15" width="120" height="120" style="image-rendering:pixelated" href="data:image/png;base64,"/>
  <g class="page1">
    <text class="t" x="170" y="62" textLength="317" lengthAdjust="spacing">* all i need is to win once...</text>
    <text class="t" x="170" y="102" textLength="505" lengthAdjust="spacing">* and i can get rid of you, once and for all.</text>
    <g clip-path="url(#in)">
      <rect class="cv ty1" x="168" y="38" width="560" height="34"/>
      <rect class="cv ty2" x="168" y="78" width="560" height="34"/>
    </g>
  </g>
  <g class="page2">
  <text class="t" x="170" y="62" textLength="354" lengthAdjust="spacing">* is this really what you want?</text>
  <g clip-path="url(#in)"><rect class="cv ty3" x="168" y="38" width="560" height="34"/></g>
  </g>
  <rect class="flash" x="0" y="0" width="720" height="150" fill="#00C8FF" fill-opacity="0.18"/>
</svg>
