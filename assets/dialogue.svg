<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0 0 720 150">
<!-- Font: "Sans" by Ryan B (rilencavy), https://fontstruct.com/fontstructions/show/1212388/sans_85, CC BY-SA 3.0 (TTF via gitlab.com/cartr/undertale-fonts). Sans portrait sprite from UNDERTALE by Toby Fox. -->
  <style>
    @font-face { font-family: 'UTSans'; src: url(data:font/ttf;base64,) format('truetype'); }
    .t { font: 26px 'UTSans','Comic Sans MS','DejaVu Sans Mono',Menlo,monospace; fill: #FFFFFF; white-space: pre; }
    .cv { fill: #000000; }
    .p0 { animation: w0 9s infinite steps(1); }
    .p1 { opacity: 0; animation: w1 9s infinite steps(1); }
    @keyframes w0 { 0%,62% { opacity: 1; } 63%,78% { opacity: 0; } 79%,100% { opacity: 1; } }
    @keyframes w1 { 0%,62% { opacity: 0; } 63%,78% { opacity: 1; } 79%,100% { opacity: 0; } }
    .c1 { animation: l1 9s infinite steps(20, end); }
    .c2 { animation: l2 9s infinite steps(36, end); }
    @keyframes l1 { 0% { transform: translateX(0); } 18% { transform: translateX(236px); } 100% { transform: translateX(236px); } }
    @keyframes l2 { 0%, 22% { transform: translateX(0); } 55% { transform: translateX(460px); } 100% { transform: translateX(460px); } }
  </style>
  <rect x="0" y="0" width="720" height="150" fill="#000"/>
  <rect x="6" y="6" width="708" height="138" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <image class="p0" x="30" y="15" width="120" height="120" style="image-rendering:pixelated" href="data:image/png;base64,"/>
  <image class="p1" x="30" y="15" width="120" height="120" style="image-rendering:pixelated" href="data:image/png;base64,"/>
  <text class="t" x="170" y="62" textLength="236" lengthAdjust="spacing">* The code compiles.</text>
  <text class="t" x="170" y="102" textLength="460" lengthAdjust="spacing">* You are filled with DETERMINATION.</text>
  <defs><clipPath id="in"><rect x="12" y="12" width="696" height="126"/></clipPath></defs>
  <g clip-path="url(#in)">
  <rect class="cv c1" x="168" y="38" width="600" height="34"/>
  <rect class="cv c2" x="168" y="78" width="600" height="34"/>
  </g>
</svg>
