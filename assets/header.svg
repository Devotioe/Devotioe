<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <style>
    .bg { fill: #0D0D0D; }
    .grid { stroke: #00F0FF; stroke-opacity: .06; stroke-width: 1; }
    .t { font: 700 72px 'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace; letter-spacing: 6px; }
    .main { fill: #E6FFFF; animation: flick 6s infinite; }
    .c { fill: #00F0FF; mix-blend-mode: screen; animation: g1 3s infinite steps(1); }
    .r { fill: #FF0055; mix-blend-mode: screen; animation: g2 3.4s infinite steps(1); }
    .sub { font: 500 15px 'JetBrains Mono',Menlo,Consolas,monospace; fill: #7FA6A6; letter-spacing: 4px; }
    .scan { fill: url(#sl); animation: scan 4s linear infinite; }
    .cur { fill: #00F0FF; animation: blink 1s infinite steps(1); }
    @keyframes g1 { 0%,100%{transform:translate(0,0);opacity:0} 8%{transform:translate(-4px,1px);opacity:.9} 10%{opacity:0} 52%{transform:translate(3px,-2px);opacity:.8} 54%{opacity:0} 80%{transform:translate(-2px,0);opacity:.7} 81%{opacity:0} }
    @keyframes g2 { 0%,100%{transform:translate(0,0);opacity:0} 9%{transform:translate(4px,-1px);opacity:.9} 11%{opacity:0} 53%{transform:translate(-3px,2px);opacity:.8} 55%{opacity:0} 81%{transform:translate(2px,1px);opacity:.7} 82%{opacity:0} }
    @keyframes flick { 0%,100%{opacity:1} 8.5%{opacity:.4} 9.5%{opacity:1} 52.5%{opacity:.6} 53.5%{opacity:1} }
    @keyframes scan { from{transform:translateY(-60px)} to{transform:translateY(220px)} }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  </style>
  <defs>
    <linearGradient id="sl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00F0FF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" class="grid" fill="none"/>
    </pattern>
  </defs>
  <rect class="bg" width="800" height="200" rx="12"/>
  <rect width="800" height="200" fill="url(#g)" rx="12"/>
  <g text-anchor="middle">
    <text class="t c" x="400" y="112">DEVO</text>
    <text class="t r" x="400" y="112">DEVO</text>
    <text class="t main" x="400" y="112">DEVO</text>
    <text class="sub" x="400" y="152">NCCU MIS · PSY · NI · GAME DEV</text>
  </g>
  <rect class="cur" x="612" y="140" width="10" height="16"/>
  <rect class="scan" x="0" y="0" width="800" height="50"/>
</svg>
